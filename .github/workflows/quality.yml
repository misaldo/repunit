name: REPUNIT quality gate

on:
  pull_request:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "restore/**"

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run automated tests
        run: npm test
      - name: Build production app
        run: npm run build
