name: REPUNIT checks

on:
  push:
    branches: [feat/top-database-ranking]
  pull_request:

permissions:
  contents: write

jobs:
  app:
    if: github.event_name == 'push' || github.head_ref == 'feat/top-database-ranking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and lint changed TOP route
        run: |
          npx prettier --write src/routes/leaderboards.tsx src/components/leaderboard-list.tsx
          npx eslint src/routes/leaderboards.tsx --fix
      - name: Commit formatting fixes to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/routes/leaderboards.tsx src/components/leaderboard-list.tsx
            git commit -m "style(top): format and lint ranking UI"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - run: npm run typecheck
      - name: Run repository lint baseline
        run: npm run lint
        continue-on-error: true
      - name: Lint changed TOP route
        run: npx eslint src/routes/leaderboards.tsx
      - run: npm test
      - run: npm run build
